seed: 2026

paths:
  standard_features: data/processed/features_standard.parquet
  random_features: data/processed/features_random.parquet
  item_feature_dir: artifacts/item_features
  biased_model: artifacts/ranker/lightgbm_long_view.txt
  density_model: artifacts/debias/exposure_density.txt
  debiased_model: artifacts/ranker/lightgbm_long_view_debiased.txt
  adapted_model: artifacts/ranker/lightgbm_long_view_random_adapted.txt
  randomized_results: results/randomized_evaluation.json
  debias_results: results/debias_evaluation.json
  adaptation_results: results/randomized_adaptation.json

propensity:
  validation_fraction: 0.2
  model:
    boosting_type: gbdt
    learning_rate: 0.05
    num_leaves: 15
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 2.0
    num_threads: 8
    verbosity: -1
    num_boost_round: 500
    early_stopping_rounds: 30
    log_period: 25

weighting:
  clip_min: 0.1
  clip_max: 10.0

adaptation:
  calibration_train_fraction: 0.8
  randomized_mass_candidates: [0.1, 0.25, 0.5]

training:
  internal_validation_fraction: 0.1
  max_train_rows: 1000000
  max_internal_validation_rows: 250000

ranking_model:
  boosting_type: gbdt
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 1.0
  num_threads: 8
  verbosity: -1
  num_boost_round: 1000
  early_stopping_rounds: 50
  log_period: 25

evaluation:
  batch_rows: 250000
