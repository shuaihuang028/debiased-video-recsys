[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-recsys"
version = "0.1.0"
description = "Leakage-safe two-stage recommendation on KuaiRand"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.1,<2",
  "faiss-cpu>=1.8,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lightgbm>=4.5,<5",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=12,<22",
  "PyYAML>=6,<7",
  "redis>=5,<7",
  "torch>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
recsys = "short_video_recsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
